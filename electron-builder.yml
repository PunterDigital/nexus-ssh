appId: com.punterdigital.nexus
productName: Nexus
copyright: Copyright © 2026 Punter Digital Limited

directories:
  output: dist-release
  buildResources: resources

files:
  - dist/**/*
  - package.json

# Releases are created by .github/workflows/release.yml (electron-builder runs with --publish never);
# this block only tells electron-updater where to look for updates.
publish:
  provider: github
  owner: PunterDigital
  repo: nexus-ssh

# Windows
win:
  artifactName: ${productName}-Setup-${version}.${ext}
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

# macOS
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  # Unsigned builds: ad-hoc sign so Apple Silicon will run the app; hardened runtime needs a real identity.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development

asar: true

# Native modules: @journeyapps/sqlcipher is N-API, so electron-builder's rebuild step just fetches the
# prebuilt binary for each target arch (needed for the x64 + arm64 macOS builds).
buildDependenciesFromSource: false
nodeGypRebuild: false
npmRebuild: true
