name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Release bumps (`chore(release)`: version lines + CHANGELOG only) skip the heavy
    # job below: the tag's release workflow builds and checks the packages anyway.
    name: Detect release bump
    runs-on: ubuntu-latest
    outputs:
      version_only: ${{ steps.check.outputs.version_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "version_only=$(node scripts/is-version-bump.mjs "$BASE" "$HEAD")" | tee -a "$GITHUB_OUTPUT"

  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Start-up chunk within budget
        run: pnpm check:bundle
      - name: Add the Intel (x64) SQLCipher binary alongside arm64
        if: runner.os == 'macOS'
        working-directory: node_modules/@journeyapps/sqlcipher
        run: |
          ./node_modules/.bin/node-pre-gyp install --target_arch=x64 --update-binary
          ls lib/binding

  package:
    name: E2E + package (${{ matrix.os }})
    needs: [check, changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifacts: |
              dist-release/*.exe
          - os: macos-latest
            target: --mac
            artifacts: |
              dist-release/*.dmg
    runs-on: ${{ matrix.os }}
    # Steps (not the job) carry the release-bump skip: a skipped matrix job reports one
    # unexpanded check name, and the required per-OS checks would never arrive.
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.version_only != 'true'
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.version_only != 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.version_only != 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.version_only != 'true'
      - run: pnpm build
        if: needs.changes.outputs.version_only != 'true'
      - name: Add the Intel (x64) SQLCipher binary alongside arm64
        if: needs.changes.outputs.version_only != 'true' && (runner.os == 'macOS')
        working-directory: node_modules/@journeyapps/sqlcipher
        run: |
          ./node_modules/.bin/node-pre-gyp install --target_arch=x64 --update-binary
          ls lib/binding
      - name: End-to-end smoke test
        if: needs.changes.outputs.version_only != 'true'
        run: pnpm exec playwright test
      - name: Package
        if: needs.changes.outputs.version_only != 'true'
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - name: End-to-end smoke test (packaged app)
        if: needs.changes.outputs.version_only != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export NEXUS_E2E_EXECUTABLE="$PWD/dist-release/win-unpacked/Nexus.exe"
          else
            export NEXUS_E2E_EXECUTABLE="$(ls -d "$PWD"/dist-release/mac-arm64/Nexus.app)/Contents/MacOS/Nexus"
          fi
          pnpm exec playwright test
      - name: Verify app icon (Windows)
        if: needs.changes.outputs.version_only != 'true' && (runner.os == 'Windows')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/check-win-icon.ps1 dist-release/win-unpacked/Nexus.exe "dist-release/Nexus-Setup-$v.exe"
      - name: Verify app icon (macOS)
        if: needs.changes.outputs.version_only != 'true' && (runner.os == 'macOS')
        run: |
          for app in dist-release/mac*/Nexus.app; do
            icon=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$app/Contents/Info.plist")
            echo "== $app: CFBundleIconFile=$icon"
            cmp resources/icon.icns "$app/Contents/Resources/${icon%.icns}.icns"
          done
      - name: Verify macOS signature
        if: needs.changes.outputs.version_only != 'true' && (runner.os == 'macOS')
        run: |
          for app in dist-release/mac*/Nexus.app; do
            echo "== $app ($(lipo -archs "$app/Contents/MacOS/Nexus"))"
            codesign --verify --deep --strict --verbose=2 "$app"
            for bin in "$app"/Contents/Resources/app.asar.unpacked/node_modules/@journeyapps/sqlcipher/lib/binding/*/node_sqlite3.node; do
              echo "$bin: $(lipo -archs "$bin")"
            done
          done
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.version_only != 'true' && (always())
        with:
          name: nexus-${{ runner.os }}
          path: |
            ${{ matrix.artifacts }}
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
