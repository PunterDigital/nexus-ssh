name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Add the Intel (x64) SQLCipher binary alongside arm64
        if: runner.os == 'macOS'
        working-directory: node_modules/@journeyapps/sqlcipher
        run: |
          ./node_modules/.bin/node-pre-gyp install --target_arch=x64 --update-binary
          ls lib/binding

  package:
    name: E2E + package (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifacts: |
              dist-release/*.exe
          - os: macos-latest
            target: --mac
            artifacts: |
              dist-release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Add the Intel (x64) SQLCipher binary alongside arm64
        if: runner.os == 'macOS'
        working-directory: node_modules/@journeyapps/sqlcipher
        run: |
          ./node_modules/.bin/node-pre-gyp install --target_arch=x64 --update-binary
          ls lib/binding
      - name: End-to-end smoke test
        run: pnpm exec playwright test
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - name: End-to-end smoke test (packaged app)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export NEXUS_E2E_EXECUTABLE="$PWD/dist-release/win-unpacked/Nexus.exe"
          else
            export NEXUS_E2E_EXECUTABLE="$(ls -d "$PWD"/dist-release/mac-arm64/Nexus.app)/Contents/MacOS/Nexus"
          fi
          pnpm exec playwright test
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: |
          for app in dist-release/mac*/Nexus.app; do
            echo "== $app ($(lipo -archs "$app/Contents/MacOS/Nexus"))"
            codesign --verify --deep --strict --verbose=2 "$app"
            for bin in "$app"/Contents/Resources/app.asar.unpacked/node_modules/@journeyapps/sqlcipher/lib/binding/*/node_sqlite3.node; do
              echo "$bin: $(lipo -archs "$bin")"
            done
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nexus-${{ runner.os }}
          path: |
            ${{ matrix.artifacts }}
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
