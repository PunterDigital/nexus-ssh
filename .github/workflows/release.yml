name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            # Windows ships x64 only (same arch as the runner): the prebuilt N-API binaries are
            # already right, and electron-builder's node-gyp can't find the runner's Visual Studio.
            target: --win -c.npmRebuild=false
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: |
            dist-release/*.exe
            dist-release/*.exe.blockmap
            dist-release/*.dmg
            dist-release/*.dmg.blockmap
            dist-release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Nexus ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
